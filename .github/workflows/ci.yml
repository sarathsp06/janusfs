name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Per SPEC.md (macOS-only, FUSE-T): build and unit tests run on a macOS
    # runner. Mounted integration tests (`make integration`) need FUSE-T
    # installed and are not run here yet — they're wired in once Phase 0's
    # spike is complete (SPEC.md §24).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: gofmt check
        run: |
          diff <(gofmt -l .) <(printf '')

      - name: go vet
        run: go vet ./...

      - name: build
        run: make build

      - name: unit tests
        run: make test
