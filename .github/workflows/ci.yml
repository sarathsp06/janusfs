name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Safety net: the mounted-FUSE step can wedge a runner if a mount fails to
    # release; cap the whole job so a wedge fails in minutes, never at the 6h
    # ceiling.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev

      - name: gofmt check
        run: |
          diff <(gofmt -l .) <(printf '')

      - name: go vet
        run: go vet ./...

      - name: go vet (fuseintegration tag)
        # The mounted-integration tests only compile under this tag; without
        # this step a refactor can silently break them for weeks (it did).
        run: go vet -tags fuseintegration ./...

      - name: build
        run: make build

      - name: unit tests
        run: make test

      # Run the mounted-FUSE tests inside a container with an explicit
      # /dev/fuse device and SYS_ADMIN, the environment they reliably mount and
      # cleanly lazy-unmount in. Running them bare on the hosted runner wedges
      # on FUSE unmount. -timeout bounds any single hang.
      - name: FUSE integration tests
        run: |
          docker run --rm \
            --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
            -v "$PWD:/src" -w /src -e HOME=/root \
            golang:1.26 bash -euc '
              apt-get update -qq >/dev/null && apt-get install -y -qq fuse3 >/dev/null
              go test -tags fuseintegration -timeout 300s ./...
            '

  release-smoke-test:
    name: GoReleaser snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Install syft (for SBOM generation)
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
