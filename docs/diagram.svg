<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f6f2" />

  <!-- Agent box -->
  <g>
    <rect x="40" y="30" rx="6" ry="6" width="160" height="60" fill="#ffffff" stroke="#333" stroke-width="2" filter="url(#shadow)" />
    <text x="120" y="60" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" fill="#333">Agent (untrusted)</text>
  </g>

  <!-- JanusFS box -->
  <g>
    <rect x="260" y="10" rx="8" ry="8" width="380" height="120" fill="#ffffff" stroke="#333" stroke-width="2" filter="url(#shadow)" />
    <text x="450" y="40" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#111">JanusFS (FUSE mount)</text>
    <text x="450" y="64" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#444">Policy snapshot (.janusignore /.janusmask)</text>

    <!-- Decision lanes inside JanusFS -->
    <rect x="285" y="90" width="110" height="22" rx="4" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="340" y="106" text-anchor="middle" font-family="Inter" font-size="11" fill="#2e7d32">ALLOWED → passthrough</text>

    <rect x="405" y="90" width="140" height="22" rx="4" fill="#fff3e0" stroke="#ff9538" />
    <text x="475" y="106" text-anchor="middle" font-family="Inter" font-size="11" fill="#bf5b1a">MASKED → redaction (RAM)</text>

    <rect x="555" y="90" width="120" height="22" rx="4" fill="#ffebee" stroke="#d32f2f" />
    <text x="615" y="106" text-anchor="middle" font-family="Inter" font-size="11" fill="#c62828">HIDDEN → deny (EACCES)</text>
  </g>

  <!-- Disk box -->
  <g>
    <rect x="260" y="160" rx="8" ry="8" width="380" height="80" fill="#ffffff" stroke="#333" stroke-width="2" filter="url(#shadow)" />
    <text x="450" y="190" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" fill="#333">Underlying real files on disk (trusted)</text>
    <text x="450" y="212" text-anchor="middle" font-family="Inter" font-size="12" fill="#666">Data never modified by JanusFS reads</text>
  </g>

  <!-- Arrows -->
  <g stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="200" y1="60" x2="260" y2="60" />
    <line x1="450" y1="130" x2="450" y2="160" />
  </g>

  <!-- Annotations -->
  <g font-family="Inter,Segoe UI,Arial" font-size="12" fill="#333">
    <text x="150" y="85">read/open/readdir</text>
    <text x="460" y="220" text-anchor="middle">passthrough fd or redacted bytes</text>
  </g>

  <!-- Small legend -->
  <g transform="translate(40,260)">
    <rect x="0" y="0" width="180" height="120" rx="6" fill="#fff" stroke="#333" stroke-width="1" />
    <text x="8" y="18" font-weight="700" font-family="Inter">Legend</text>
    <rect x="12" y="30" width="12" height="12" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="32" y="40">Allowed — passthrough</text>
    <rect x="12" y="54" width="12" height="12" fill="#fff3e0" stroke="#ff9538" />
    <text x="32" y="64">Masked — redacted, same length</text>
    <rect x="12" y="78" width="12" height="12" fill="#ffebee" stroke="#d32f2f" />
    <text x="32" y="88">Hidden — denied (EACCES)</text>
  </g>
</svg>
