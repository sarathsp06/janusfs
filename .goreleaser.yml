# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# JanusFS release configuration. Produces Linux binaries per release: tarballs
# with the binary + docs + license, checksums, a CycloneDX SBOM, a source
# archive, and Conventional-Commits-grouped release notes. Tag releases are
# published to the GitHub Releases page by the release workflow. JanusFS is
# Linux-only (kernel-enforced isolation is a Linux feature); no macOS artifacts
# are built.

version: 2

project_name: janusfs

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: janusfs
    main: ./cmd/janusfs
    binary: janusfs
    # Linux-only: JanusFS enforcement (FUSE + namespaces) is a Linux feature.
    # No CGO in the janusfs binary itself (SPEC §20's dependency policy forbids
    # cgo).
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: janusfs
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE*
      - README.md
      - SPEC.md
      - AGENTS.md
      - docs/**/*

source:
  # A companion source-code archive per release makes it easy to verify a
  # binary was built from the tagged tree without cloning the repo.
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  # Software Bill of Materials via syft (CycloneDX JSON). syft must be
  # installed; the release workflow installs it automatically. Local runs:
  # `brew install syft` (macOS) or the install script on other platforms.
  - id: janusfs-sbom
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.cyclonedx.json"
    cmd: syft
    args:
      - "$artifact"
      - --output
      - cyclonedx-json=$document

snapshot:
  # `make release-snapshot` produces artifacts named e.g.
  # janusfs_0.1.0-next+abcdef_linux_amd64.tar.gz so it's obvious they aren't a
  # real release.
  version_template: "{{ incpatch .Version }}-next+{{ .ShortCommit }}"

changelog:
  # Conventional Commits grouping, matching AGENTS.md's existing
  # "Conventional Commits (feat:, fix:, ...) for changelog hygiene" note.
  # Regexps must be RE2-compatible: GoReleaser uses Go regexp, not PCRE.
  sort: asc
  groups:
    - title: Added
      regexp: '^.*?feat(\([[:alnum:]_-]+\))??!?:.+$'
      order: 0
    - title: Fixed
      regexp: '^.*?fix(\([[:alnum:]_-]+\))??!?:.+$'
      order: 1
    - title: Changed
      regexp: '^.*?(perf|refactor|style|chore)(\([[:alnum:]_-]+\))??!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\([[:alnum:]_-]+\))??!?:.+$'
      order: 3
    - title: Other
      order: 999
  filters:
    exclude:
      - "^test:"
      - "^ci:"
      - "^build:"
      - "^chore\\(release\\):"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch

release:
  # Publish tag builds directly so pushed v* tags create downloadable binaries
  # on the GitHub Releases page.
  draft: false
  prerelease: auto
  name_template: "JanusFS {{ .Version }}"
  header: |
    # JanusFS {{ .Version }}

    A policy-enforcing filesystem for AI agents. See [`README.md`](https://github.com/sarathsp06/janusfs/blob/main/README.md) for the pitch and [`SPEC.md`](https://github.com/sarathsp06/janusfs/blob/main/SPEC.md) for the engineering contract.
  footer: |
    ---

    ## Install

    ```bash
    # Ubuntu/Debian:
    sudo apt-get install -y fuse3

    # Then download the matching Linux archive from the assets below, or:
    go install github.com/sarathsp06/janusfs/cmd/janusfs@{{ .Tag }}
    ```

    ## Verify the download

    ```bash
    shasum -a 256 -c checksums.txt
    ```

    Full changelog: {{ .PreviousTag }}...{{ .Tag }}

# JanusFS is Linux-only, so there is no Homebrew tap. Distribute via the release
# tarballs above or `go install`.
